[project]
name = "helpchoreai"
version = "0.1.0"
description = "Biophysical measurement and protocol-variance auditing for microfluidic RBC recordings (VPS13A research)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "cryptography",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
